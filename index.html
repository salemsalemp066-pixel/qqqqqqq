<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1C242B">
<title>مدرسة اقرأ للإبداع العلمي | تطبيق ولي الأمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#303B47; --ink-2:#1C242B; --teal:#2D6E56; --teal-l:#E3F1EC;
  --amber:#C8272C; --amber-2:#DE4B4B; --amber-l:#FCE3E3; --success:#016F45; --success-l:#E3F5EA;
  --danger:#C8272C; --danger-l:#FBE9E9; --warn:#C8272C; --warn-l:#FBE9E9;
  --bg:#EFF2F7; --card:#FFFFFF; --text:#1D2939; --muted:#667085; --border:#E4E7EC;
  --r:18px; --r-sm:12px;
  --gold-grad:linear-gradient(135deg,#DE4B4B 0%,#C8272C 55%,#8F1A1E 100%);
  --navy-grad:linear-gradient(160deg,var(--ink) 0%,var(--ink-2) 60%,#3A1F22 100%);
  --shadow-sm:0 1px 3px rgba(22,33,62,.06);
  --shadow-md:0 6px 20px rgba(22,33,62,.08);
  --shadow-lg:0 14px 34px rgba(22,33,62,.16);
  --shadow-gold:0 8px 20px rgba(200,39,44,.20);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
html{scroll-behavior:smooth; touch-action:manipulation; overscroll-behavior:none; height:100%; width:100%; position:fixed; overflow:hidden; background:var(--ink-2);}
html,body{overscroll-behavior-y:none;}
body{
  font-family:'Tajawal',sans-serif; background:var(--ink-2); color:var(--text);
  display:flex; justify-content:center; height:100%; width:100%; position:fixed; inset:0; overflow:hidden;
  touch-action:manipulation;
}
input, textarea, select{ font-size:16px !important; touch-action:manipulation; }
.display{font-family:'Almarai',sans-serif; font-variant-numeric:tabular-nums;}
@media (prefers-reduced-motion:no-preference){
  button, .kid-chip, .stat-card, .card.subject-card, .nav-btn, .seg-btn, .pay-btn, .wl-btn{ transition:transform .12s ease, opacity .12s ease, background .15s ease; }
  button:active, .kid-chip:active, .stat-card:active, .nav-btn:active, .seg-btn:active, .pay-btn:active, .wl-btn:active{ transform:scale(.95); }
}
#app{width:100%; max-width:480px; background:var(--bg); height:100%; display:none; flex-direction:column; position:relative; box-shadow:0 0 50px rgba(22,33,62,.16); opacity:0;}
#app.show{display:flex; animation:appIn .35s ease forwards;}
@keyframes appIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}

/* Splash */
#splashScreen{
  width:100%; max-width:480px; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--navy-grad); color:#fff; position:fixed; inset:0; margin:auto; z-index:100; overflow:hidden;
  transition:opacity .4s ease, transform .4s ease;
}
#splashScreen::before{content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size:22px 22px; opacity:.5;}
#splashScreen::after{content:''; position:absolute; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(200,39,44,.12),transparent 70%); top:-90px; left:-70px;}
#splashScreen.fade-out{opacity:0; transform:scale(1.03); pointer-events:none;}
.splash-logo{
  width:84px; height:84px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center;
  font-size:40px; margin-bottom:18px; animation:pulseLogo 1.4s ease-in-out infinite; box-shadow:var(--shadow-gold); position:relative; z-index:1; overflow:hidden; padding:0;
}
.splash-logo img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
@keyframes pulseLogo{0%,100%{transform:scale(1)} 50%{transform:scale(1.08)}}
.splash-title{font-family:'Almarai',sans-serif; font-weight:800; font-size:24px; position:relative; z-index:1; letter-spacing:.3px;}
.splash-sub{font-size:12.5px; color:#B9C2D6; margin-top:6px; position:relative; z-index:1;}
.splash-dots{display:flex; gap:6px; margin-top:30px; position:relative; z-index:1;}
.splash-dots span{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35); animation:dotBlink 1.2s infinite;}
.splash-dots span:nth-child(2){animation-delay:.15s;}
.splash-dots span:nth-child(3){animation-delay:.3s;}
@keyframes dotBlink{0%,80%,100%{opacity:.3} 40%{opacity:1; background:var(--amber);}}

/* Login */
#loginScreen{
  width:100%; max-width:480px; height:100%; background:var(--bg); position:fixed; inset:0; margin:auto; z-index:90;
  display:none; flex-direction:column; padding:0 26px; opacity:0; transition:opacity .35s ease; overflow:hidden;
}
#loginScreen.show{display:flex; opacity:1;}
.login-hero{
  background:var(--navy-grad); margin:0 -26px 26px; padding:56px 26px 40px;
  border-radius:0 0 32px 32px; color:#fff; text-align:center;
  position:sticky; top:0; z-index:5; flex-shrink:0; overflow:hidden;
}
.login-hero::before{content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size:20px 20px; opacity:.5; pointer-events:none;}
.login-hero .logo{width:56px; height:56px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:27px; margin:0 auto 14px; box-shadow:var(--shadow-gold); position:relative; overflow:hidden; padding:0;}
.login-hero .logo img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
.login-hero h2{font-family:'Almarai',sans-serif; font-size:20px; font-weight:800; position:relative;}
.login-hero p{font-size:12px; color:#B9C2D6; margin-top:5px; position:relative;}
.login-form{flex:1; display:flex; flex-direction:column;}
.field-label{font-size:12.5px; font-weight:700; margin-bottom:7px; color:var(--text);}
.field-wrap{position:relative; margin-bottom:16px;}
.field-wrap input{
  width:100%; border:1.5px solid var(--border); background:var(--card); border-radius:13px; padding:14px 44px 14px 14px;
  font-size:14px; font-family:'Tajawal',sans-serif; color:var(--text); transition:border-color .15s ease, box-shadow .15s ease;
}
.field-wrap input:focus{outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-l);}
.field-icon{position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.5;}
.login-btn{
  background:var(--navy-grad); color:#fff; border:none; border-radius:13px; padding:15px; font-size:14.5px; font-weight:800;
  cursor:pointer; font-family:'Tajawal',sans-serif; margin-top:6px; box-shadow:var(--shadow-md);
}
.login-hint{text-align:center; font-size:11.5px; color:var(--muted); margin-top:16px; line-height:1.7;}
.login-error{background:var(--danger-l); color:var(--danger); font-size:12px; font-weight:700; padding:10px 14px; border-radius:10px; margin-bottom:14px; display:none;}
.login-error.show{display:block;}
.login-footer{text-align:center; padding:22px 0; font-size:11px; color:var(--muted);}

/* Header */
header.top{
  background:var(--navy-grad);
  color:#fff; padding:18px 16px 14px; position:sticky; top:0; z-index:20;
  border-radius:0 0 24px 24px; position:relative; overflow:hidden;
  transition:padding .3s cubic-bezier(.4,0,.2,1), border-radius .3s ease;
}
header.top::before{content:''; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size:20px 20px; pointer-events:none;}
header.top::after{content:''; position:absolute; width:170px; height:170px; border-radius:50%; background:radial-gradient(circle,rgba(200,39,44,.10),transparent 70%); top:-70px; left:-50px; pointer-events:none;}
header.top > *{position:relative; z-index:1;}
header.top.scrolled{padding:10px 16px 10px; border-radius:0 0 18px 18px; box-shadow:0 6px 20px rgba(22,33,62,.22);}
header.top.scrolled .brand .logo{width:30px; height:30px; border-radius:50%; font-size:15px;}
header.top.scrolled .brand h1{font-size:14.5px;}
header.top.scrolled .brand p{opacity:0; max-height:0; margin:0;}
header.top.scrolled .bell{width:32px; height:32px;}
header.top.scrolled .bell svg{width:15px; height:15px;}
header.top.scrolled .kids-row{margin-top:10px; transform:scale(.92); transform-origin:right top;}
header.top .brand .logo{transition:width .3s ease, height .3s ease, font-size .3s ease;}
header.top .brand h1{transition:font-size .3s ease;}
header.top .brand p{transition:opacity .2s ease, max-height .3s ease; max-height:16px;}
header.top .bell{transition:width .3s ease, height .3s ease;}
header.top .kids-row{transition:transform .3s cubic-bezier(.4,0,.2,1), margin-top .3s ease;}
.brand-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .logo{
  width:38px; height:38px; border-radius:50%; background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:19px; box-shadow:0 4px 12px rgba(200,39,44,.22); overflow:hidden; padding:0;
}
.brand .logo img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
.brand h1{font-size:17px; font-family:'Almarai',sans-serif; font-weight:800; letter-spacing:.2px;}
.brand p{font-size:11px; color:#B9C2D6; margin-top:1px;}
.bell{
  width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.1);
  display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; border:none;
}
.bell svg{width:18px; height:18px; fill:#fff;}
.bell .dot{position:absolute; top:7px; left:8px; width:8px; height:8px; border-radius:50%; background:var(--amber); border:2px solid var(--ink);}

.kids-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:2px; margin-top:20px; scrollbar-width:none;}
.kids-row::-webkit-scrollbar{display:none;}
.kid-chip{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.08);
  border:1.5px solid rgba(255,255,255,.12); border-radius:999px; padding:6px 12px 6px 6px; cursor:pointer;
  transition:.15s;
}
.kid-chip.active{background:rgba(255,255,255,.97); border-color:transparent; box-shadow:0 6px 16px rgba(0,0,0,.18);}
.kid-chip.active .kid-name{color:var(--ink);}
.kid-chip.active .kid-sub{color:var(--teal);}
.kid-avatar-wrap{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--gold-grad); box-shadow:0 2px 6px rgba(0,0,0,.15);}
.kid-avatar-wrap .av{width:30px; height:30px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:15px;}
.kid-name{font-size:12.5px; font-weight:700; color:#fff; white-space:nowrap;}
.kid-sub{font-size:10px; color:#AEB8CC;}

/* Content */
main{flex:1; padding:14px 14px calc(90px + env(safe-area-inset-bottom)); overflow-y:auto; -webkit-overflow-scrolling:touch;}
.section{display:none;}
.section.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}

.card{background:var(--card); border-radius:var(--r); padding:16px; box-shadow:var(--shadow-sm); border:1px solid var(--border); margin-bottom:12px;}
.section-title{font-family:'Almarai',sans-serif; font-weight:800; font-size:15px; margin:20px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding-inline-start:10px; border-inline-start:3px solid var(--amber); position:relative;}
.section-title:first-child{margin-top:0;}
.link-btn{font-size:12px; color:var(--teal); font-weight:700; cursor:pointer; background:none; border:none;}

/* Home grid */
.home-greet{font-size:13px; color:var(--muted); margin:2px 0 12px;}
.home-greet b{color:var(--text); font-family:'Almarai',sans-serif; font-weight:800;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.stat-card{
  background:var(--card); border-radius:var(--r); padding:15px; border:1px solid var(--border);
  position:relative; overflow:hidden; box-shadow:var(--shadow-sm);
}
.stat-card::after{content:''; position:absolute; width:64px; height:64px; border-radius:50%; top:-26px; left:-26px; background:var(--sc-tint,transparent); opacity:.55;}
.stat-card .ic{width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:10px; position:relative; z-index:1; box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);}
.stat-card .val{font-family:'Almarai',sans-serif; font-weight:800; font-size:21px; position:relative; z-index:1;}
.stat-card .lbl{font-size:11.5px; color:var(--muted); margin-top:3px; position:relative; z-index:1; line-height:1.4;}

.ring-hero{
  display:flex; align-items:center; gap:18px; background:linear-gradient(135deg,var(--ink) 0%, var(--ink-2) 100%);
  color:#fff; border:none; position:relative; overflow:hidden; padding:20px; box-shadow:var(--shadow-lg);
}
.ring-hero::after{content:''; position:absolute; width:150px; height:150px; background:rgba(200,39,44,.22); border-radius:50%; top:-60px; left:-50px;}
.ring-hero::before{content:''; position:absolute; width:130px; height:130px; background:rgba(1,111,69,.24); border-radius:50%; bottom:-55px; right:-30px;}
.ring-hero .rh-glow{position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px); background-size:18px 18px; pointer-events:none;}
.ring-hero svg{transform:rotate(-90deg); position:relative; z-index:1;}
.ring-hero svg circle.ring-anim{transition:stroke-dashoffset 1.1s cubic-bezier(.16,.84,.44,1);}
.donut-wrap svg circle.ring-anim{transition:stroke-dashoffset 1.1s cubic-bezier(.16,.84,.44,1);}
.ring-hero .rh-text{flex:1; position:relative; z-index:1;}
.ring-hero .rh-eyebrow{font-size:11px; color:#B9C6DC; margin-bottom:2px;}
.ring-hero .rh-num{font-family:'Almarai',sans-serif; font-weight:800; font-size:28px;}
.ring-hero .rh-lbl{font-size:12px; color:#C4CCDF; margin-top:3px;}

.mini-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
.mini-row:last-child{border-bottom:none;}
.mini-ic{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.mini-body{flex:1; min-width:0;}
.mini-title{font-size:13px; font-weight:700;}
.mini-sub{font-size:11.5px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* day activity groups */
.day-card{margin-bottom:12px; padding-inline-start:12px; border-inline-start:3px solid var(--dc-accent, var(--border)); border-radius:2px;}
.day-card:last-child{margin-bottom:0;}
.day-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.day-head .day-name{font-size:13.5px; font-weight:800; font-family:'Almarai',sans-serif;}
.day-head .day-date{font-size:11px; color:var(--muted); margin-top:1px;}
.day-today-badge{display:flex; align-items:center; gap:4px; background:var(--amber-l); color:#8F1A1E; font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:999px;}
.day-today-badge .pulse-dot{width:6px; height:6px; border-radius:50%; background:var(--amber); animation:dotBlink 1.2s infinite;}
.day-att-badge{margin-inline-start:auto;}
.day-sub-label{font-size:11px; font-weight:700; color:var(--muted); margin:8px 0 6px;}
.chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.chip{background:var(--bg); border:1px solid var(--border); font-size:11px; font-weight:700; padding:5px 10px; border-radius:8px; color:var(--text);}
.day-hw-row{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12px;}
.day-hw-row .hw-dot{width:6px; height:6px; border-radius:50%; background:var(--teal); flex-shrink:0;}
.badge{font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; letter-spacing:.1px;}
.badge.success{background:var(--success-l); color:var(--success);}
.badge.danger{background:var(--danger-l); color:var(--danger);}
.badge.warn{background:var(--warn-l); color:var(--warn);}
.badge.teal{background:var(--teal-l); color:var(--teal);}
.badge.amber{background:var(--amber-l); color:#8F1A1E;}

/* Skeleton loading */
@keyframes skelShine{0%{background-position:-200% 0} 100%{background-position:200% 0}}
.skeleton{
  background:linear-gradient(100deg,#E7EAF0 30%,#F2F4F7 45%,#E7EAF0 60%);
  background-size:200% 100%; animation:skelShine 1.3s ease-in-out infinite;
  border-radius:var(--r); margin-bottom:12px;
}
.skel-hero{height:104px;}
.skel-row{height:78px;}
.skel-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.skel-grid .skeleton{height:92px; margin-bottom:0;}
.skel-line{height:14px; width:55%; border-radius:6px;}

/* Attendance */
.donut-wrap{display:flex; align-items:center; gap:18px;}
.donut-legend{flex:1; display:flex; flex-direction:column; gap:8px;}
.leg-item{display:flex; align-items:center; gap:8px; font-size:12.5px;}
.leg-dot{width:9px; height:9px; border-radius:50%;}
.leg-item b{margin-right:auto; font-family:'Almarai',sans-serif;}
.month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px;}
.day-cell{aspect-ratio:1; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; transition:transform .12s ease;}
.dow{font-size:10px; color:var(--muted); text-align:center; font-weight:700;}

/* Grades */
.subject-card{cursor:pointer; transition:box-shadow .2s ease;}
.subject-card.open{box-shadow:var(--shadow-md);}
.subject-head{display:flex; align-items:center; gap:12px;}
.subj-avg{width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-family:'Almarai',sans-serif; font-weight:800; font-size:14px; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);}
.subj-body{flex:1;}
.subj-name{font-size:13.5px; font-weight:700;}
.subj-teacher{font-size:11px; color:var(--muted); margin-top:1px;}
.subj-bar{height:5px; border-radius:999px; background:var(--bg); margin-top:10px; overflow:hidden;}
.subj-bar-fill{height:100%; border-radius:999px; transition:width 1s cubic-bezier(.16,.84,.44,1);}
.chev{transition:.2s; color:var(--muted);}
.subject-card.open .chev{transform:rotate(180deg);}
.assess-list{max-height:0; overflow:hidden; transition:.25s;}
.subject-card.open .assess-list{max-height:600px; margin-top:12px;}
.assess-row{display:flex; align-items:center; justify-content:space-between; padding:9px 11px; background:var(--bg); border-radius:10px; margin-bottom:6px; font-size:12px;}
.assess-row .at{color:var(--muted); font-size:10.5px;}
.assess-row:last-child{margin-bottom:0;}

/* Wallet */
.wallet-hero{background:linear-gradient(135deg,var(--ink) 0%, var(--ink-2) 100%); border-radius:var(--r); padding:22px 20px; color:#fff; margin-bottom:14px; position:relative; overflow:hidden; box-shadow:var(--shadow-lg);}
.wallet-hero::before{content:''; position:absolute; inset:0; background:radial-gradient(circle at 92% 105%, rgba(1,111,69,.24), transparent 55%), radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size:auto, 18px 18px;}
.wallet-hero::after{content:''; position:absolute; width:140px; height:140px; background:rgba(200,39,44,.20); border-radius:50%; top:-50px; left:-40px;}
.wallet-hero>*{position:relative; z-index:1;}
.wallet-hero .wl-lbl{font-size:12px; color:#C4CCDF;}
.wallet-hero .wl-num{font-family:'Almarai',sans-serif; font-weight:800; font-size:30px; margin:6px 0 14px;}
.wl-actions{display:flex; gap:10px;}
.wl-btn{flex:1; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); color:#fff; padding:10px; border-radius:11px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:'Tajawal',sans-serif;}
.wl-btn.primary{background:var(--gold-grad); color:#fff; border:none; box-shadow:0 4px 12px rgba(200,39,44,.22);}
.fin-split{display:flex; align-items:center; gap:14px;}
.fin-col{flex:1; text-align:center;}
.fin-val{font-family:'Almarai',sans-serif; font-weight:800; font-size:22px;}
.fin-lbl{font-size:11px; color:#C4CCDF; margin-top:3px;}
.fin-divider{width:1px; height:38px; background:rgba(255,255,255,.2);}
.txn-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
.txn-row:last-child{border-bottom:none;}
.txn-ic{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px;}
.txn-amt{font-family:'Almarai',sans-serif; font-weight:800; font-size:13px;}

/* More tab */
.seg{display:flex; background:var(--card); border:1px solid var(--border); border-radius:13px; padding:4px; gap:4px; margin-bottom:14px; overflow-x:auto; box-shadow:var(--shadow-sm);}
.seg-btn{flex:0 0 auto; padding:8px 13px; border-radius:10px; font-size:12px; font-weight:700; background:none; border:none; color:var(--muted); cursor:pointer; font-family:'Tajawal',sans-serif; white-space:nowrap; transition:.15s;}
.seg-btn.active{background:var(--navy-grad); color:#fff; box-shadow:var(--shadow-sm);}

/* schedule table */
.sched-days{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; scrollbar-width:none;}
.sched-days::-webkit-scrollbar{display:none;}
.sched-day-btn{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 15px;
  border-radius:13px; background:var(--card); border:1.5px solid var(--border); cursor:pointer;
  font-family:'Tajawal',sans-serif; transition:.15s;
}
.sched-day-btn .sd-name{font-size:12px; font-weight:700; color:var(--text);}
.sched-day-btn .sd-count{font-size:9.5px; color:var(--muted); margin-top:1px; white-space:nowrap;}
.sched-day-btn.active{background:var(--navy-grad); border-color:var(--ink); box-shadow:var(--shadow-sm);}
.sched-day-btn.active .sd-name{color:#fff;}
.sched-day-btn.active .sd-count{color:#AEB8CC;}
.sched-day-btn.is-today:not(.active){border-color:var(--amber);}
.sched-day-btn.is-today:not(.active) .sd-name{color:#8F1A1E;}

.period-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border); border-inline-start:3px solid var(--pr-accent,var(--border)); padding-inline-start:12px;}
.period-row:last-child{border-bottom:none;}
.period-num{
  width:28px; height:28px; border-radius:9px; background:var(--bg); color:var(--muted); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; font-family:'Almarai',sans-serif;
}
.period-subj{flex:1;}
.period-subj .ps-name{font-size:13.5px; font-weight:700;}
.period-subj .ps-tag{font-size:10.5px; color:var(--muted); margin-top:1px;}
.period-row.is-break{opacity:.85;}
.period-row.is-break .period-subj .ps-name{color:#8F1A1E;}
.period-chip{width:8px; height:8px; border-radius:50%; background:var(--pr-accent,var(--border)); flex-shrink:0;}

/* homework */
.hw-row{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); align-items:flex-start;}
.hw-row:last-child{border-bottom:none;}
.hw-check{width:23px; height:23px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:2px; transition:.15s;}
.hw-check.done{background:var(--success); border-color:var(--success); color:#fff; font-size:13px; box-shadow:0 3px 8px rgba(63,148,99,.3);}
.hw-title{font-size:13px; font-weight:700;}
.hw-title.done{text-decoration:line-through; color:var(--muted);}
.hw-meta{font-size:11px; color:var(--muted); margin-top:2px;}

/* messages */
.teacher-row{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--border); cursor:pointer;}
.teacher-row:last-child{border-bottom:none;}
.t-avatar{width:42px; height:42px; border-radius:50%; background:var(--teal-l); color:var(--teal); display:flex; align-items:center; justify-content:center; font-weight:800; font-family:'Almarai',sans-serif; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);}
.t-name{font-size:13px; font-weight:700;}
.t-sub{font-size:11px; color:var(--muted); margin-top:1px;}

.chat-view{display:none; flex-direction:column; height:calc(100vh - 250px); min-height:400px;}
.chat-view.active{display:flex;}
.chat-head{display:flex; align-items:center; gap:10px; padding-bottom:12px; margin-bottom:10px; border-bottom:1px solid var(--border);}
.chat-back{background:var(--bg); border:none; width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:16px;}
.chat-msgs{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px 2px;}
.msg-bubble{max-width:78%; padding:10px 14px; border-radius:15px; font-size:12.5px; line-height:1.5;}
.msg-bubble.me{align-self:flex-start; background:var(--navy-grad); color:#fff; border-bottom-left-radius:4px; box-shadow:0 3px 10px rgba(22,33,62,.18);}
.msg-bubble.them{align-self:flex-end; background:var(--card); border:1px solid var(--border); border-bottom-right-radius:4px;}
.msg-time{font-size:9.5px; opacity:.65; margin-top:4px; display:block;}
.chat-input-row{display:flex; gap:8px; margin-top:10px;}
.chat-input-row input{flex:1; border:1px solid var(--border); border-radius:12px; padding:11px 14px; font-size:13px; font-family:'Tajawal',sans-serif; background:var(--card);}
.chat-send{width:42px; height:42px; border-radius:12px; background:var(--navy-grad); border:none; color:#fff; font-size:16px; cursor:pointer; flex-shrink:0; box-shadow:var(--shadow-sm);}

/* notifications */
.notif-row{display:flex; gap:11px; padding:12px 0; border-bottom:1px solid var(--border); cursor:pointer;}
.notif-row:last-child{border-bottom:none;}
.notif-row.unread{background:linear-gradient(90deg,var(--teal-l),transparent 40%); margin:0 -16px; padding:12px 16px; border-radius:8px;}
.notif-ic{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.notif-title{font-size:13px; font-weight:700;}
.notif-body{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.5;}
.notif-time{font-size:10px; color:var(--muted); margin-top:4px;}

/* invoices */
.inv-row{display:flex; align-items:center; gap:11px; padding:12px 0; border-bottom:1px solid var(--border);}
.inv-row:last-child{border-bottom:none;}
.inv-title{font-size:13px; font-weight:700;}
.inv-sub{font-size:11px; color:var(--muted); margin-top:1px;}
.pay-btn{background:var(--gold-grad); color:#fff; border:none; padding:8px 14px; border-radius:10px; font-size:11.5px; font-weight:800; cursor:pointer; font-family:'Tajawal',sans-serif; white-space:nowrap; box-shadow:0 3px 8px rgba(200,39,44,.22);}

/* Bottom nav */
nav.bottom{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:rgba(255,255,255,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--border); display:flex;
  padding:8px 4px calc(10px + env(safe-area-inset-bottom));
  z-index:30; border-radius:22px 22px 0 0; box-shadow:0 -6px 20px rgba(22,33,62,.08);
}
.nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; padding:6px 2px; color:var(--muted); font-family:'Tajawal',sans-serif;}
.nav-btn svg{width:21px; height:21px; fill:none; stroke:var(--muted); stroke-width:1.8;}
.nav-btn.active{color:var(--ink);}
.nav-btn.active svg{stroke:var(--ink); fill:var(--amber); fill-opacity:.15;}
.nav-btn span{font-size:10px; font-weight:700;}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(22,33,62,.5); z-index:50; display:none; align-items:flex-end; justify-content:center;}
.overlay.active{display:flex;}
.modal{background:var(--card); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:20px; animation:slideup .25s ease; box-shadow:0 -10px 30px rgba(22,33,62,.18);}
.modal::before{content:''; display:block; width:38px; height:4px; border-radius:999px; background:var(--border); margin:0 auto 16px;}
@keyframes slideup{from{transform:translateY(100%)} to{transform:translateY(0)}}
.modal h3{font-family:'Almarai',sans-serif; font-size:16px; margin-bottom:14px;}
.modal input{width:100%; border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14px; font-family:'Tajawal',sans-serif; margin-bottom:12px;}
.modal-actions{display:flex; gap:10px;}
.modal-actions button{flex:1; padding:12px; border-radius:12px; font-size:13px; font-weight:700; border:none; cursor:pointer; font-family:'Tajawal',sans-serif;}
.btn-cancel{background:var(--bg); color:var(--text);}
.btn-confirm{background:var(--navy-grad); color:#fff; box-shadow:var(--shadow-sm);}
.toast{position:fixed; bottom:95px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy-grad); color:#fff; padding:12px 22px; border-radius:12px; font-size:12.5px; font-weight:700; z-index:60; opacity:0; transition:.3s; max-width:90%; text-align:center; box-shadow:var(--shadow-lg);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.empty{text-align:center; padding:34px 10px; color:var(--muted); font-size:12.5px;}
.empty .em-ic{font-size:34px; margin-bottom:10px; opacity:.8;}

/* Printable report */
#printArea{display:none;}
.rep-header{text-align:center; margin-bottom:18px; border-bottom:2px solid var(--ink-2); padding-bottom:12px;}
.rep-logo{width:52px; height:52px; border-radius:50%; margin:0 auto 8px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#fff; box-shadow:var(--shadow-sm);}
.rep-logo img{width:100%; height:100%; object-fit:cover; display:block;}
.rep-school{font-family:'Almarai',sans-serif; font-weight:800; font-size:18px; color:var(--ink-2);}
.rep-title{font-size:13.5px; color:var(--muted); margin-top:4px;}
.rep-meta{display:flex; justify-content:space-between; gap:10px; margin-bottom:16px; font-size:13px; flex-wrap:wrap; color:var(--text);}
.rep-table{width:100%; border-collapse:collapse; font-size:13px; margin-bottom:6px;}
.rep-table th, .rep-table td{border:1px solid var(--border); padding:8px 10px; text-align:right;}
.rep-table thead{background:var(--bg);}
.rep-table tfoot td{font-weight:800; background:#F5F6F8;}
.rep-footer{margin-top:26px; text-align:center; font-size:10.5px; color:var(--muted); line-height:1.7;}
.report-btn{width:100%; margin:10px 0 4px;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; right:0; left:0; margin:0 auto; width:100%; max-width:680px; padding:28px;}
}
</style>
</head>

function pick(arr){ return arr[rand(0,arr.length-1)]; }
function fmtDate(d){ return d.toLocaleDateString('ar-LY',{day:'numeric',month:'short'}); }
function isoDate(d){ return d.toISOString().split('T')[0]; }
function dayNameAr(d){ return ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.getDay()]; }

function genChild(id,name,avatar,grade){
  const today = new Date();
  // attendance last 26 school days
  const attendance = [];
  let d = new Date(today);
  let count = 0;
  while(count < 24){
    d.setDate(d.getDate()-1);
    if(d.getDay()===5 || d.getDay()===6) continue; // fri/sat off
    const r = Math.random();
    const status = r<0.86 ? 'حاضر' : r<0.93 ? 'متأخر' : r<0.97 ? 'غياب بعذر' : 'غائب';
    attendance.push({date: isoDate(d), status});
    count++;
  }
  attendance.reverse();

  const grades = {};
  SUBJECTS.forEach(s=>{
    const n = rand(3,5);
    const list = [];
    for(let i=0;i<n;i++){
      const max = pick([10,20,25,30]);
      const score = rand(Math.floor(max*0.55), max);
      const gd = new Date(today); gd.setDate(gd.getDate()-rand(2,50));
      list.push({title:pick(ASSESS_TYPES), score, max, date:isoDate(gd)});
    }
    grades[s.name] = list;
  });

  const walletTxns = [];
  let balance = rand(15,60);
  for(let i=0;i<6;i++){
    const gd = new Date(today); gd.setDate(gd.getDate()-rand(1,30));
    const isCharge = Math.random()<0.35;
    walletTxns.push({
      date: isoDate(gd),
      type: isCharge?'شحن':'خصم',
      amount: isCharge? pick([20,30,50]) : rand(1,5),
      note: isCharge? 'شحن محفظة المقصف' : pick(['وجبة إفطار','عصير ومقرمشات','ساندويتش','مياه ومقرمشات'])
    });
  }
  walletTxns.sort((a,b)=> new Date(b.date)-new Date(a.date));

  const homework = [
    {subject:'الرياضيات', title:'حل تمارين الفصل الرابع صفحة 52', due:2, status:false},
    {subject:'اللغة العربية', title:'كتابة موضوع تعبير عن رحلة مدرسية', due:1, status:false},
    {subject:'العلوم', title:'تحضير عرض عن دورة الماء', due:4, status:true},
    {subject:'اللغة الإنجليزية', title:'Vocabulary Unit 5 exercises', due:6, status:false},
    {subject:'التربية الإسلامية', title:'حفظ سورة الأعلى', due:3, status:true},
    {subject:'الدراسات الاجتماعية', title:'ملخص درس الموارد الطبيعية', due:0, status:false},
    {subject:'الرياضيات', title:'حل أسئلة المراجعة صفحة 40', due:-1, status:true},
    {subject:'اللغة العربية', title:'قراءة نص وتلخيصه', due:-2, status:true},
  ].map(h=>{ const dd=new Date(today); dd.setDate(dd.getDate()+h.due); return {...h, dueDate:isoDate(dd)};});

  const schedule = {
    'الأحد':['رياضيات','عربي','علوم','إنجليزي','فسحة','دراسات','تربية بدنية'],
    'الاثنين':['عربي','رياضيات','إنجليزي','علوم','فسحة','تربية إسلامية','حاسوب'],
    'الثلاثاء':['علوم','دراسات','رياضيات','عربي','فسحة','إنجليزي','فن'],
    'الأربعاء':['إنجليزي','تربية إسلامية','عربي','رياضيات','فسحة','علوم','دراسات'],
    'الخميس':['دراسات','علوم','فن','رياضيات','فسحة','عربي','نشاط'],
  };

  const messages = SUBJECTS.slice(0,4).map(s=>({
    teacher: s.teacher, subject: s.name,
    thread:[
      {from:'them', text: pick([
        'السلام عليكم، أود إبلاغكم بتحسن ملحوظ في أداء الطالب هذا الأسبوع.',
        'مرحباً، يرجى متابعة حل الواجب المنزلي لهذا الأسبوع مع الطالب.',
        'تنويه: هناك اختبار قصير يوم الأحد القادم في نفس المادة.'
      ]), time:'09:14'},
    ]
  }));

  const notifications = [
    {type:'حضور', icon:'📋', title:'تسجيل غياب', body:`تم تسجيل غياب ${name} اليوم بدون عذر.`, time:'قبل يوم', read:false, color:'danger'},
    {type:'درجة', icon:'📝', title:'درجة جديدة', body:`تم رصد درجة اختبار قصير في مادة ${pick(SUBJECTS).name}.`, time:'قبل يومين', read:false, color:'teal'},
    {type:'فاتورة', icon:'🧾', title:'فاتورة مستحقة', body:'يوجد قسط دراسي مستحق السداد قبل نهاية الشهر.', time:'قبل 3 أيام', read:true, color:'amber'},
    {type:'عام', icon:'📣', title:'إعلان من الإدارة', body:'سيتم عقد اجتماع أولياء الأمور الأسبوع القادم الساعة 10 صباحاً.', time:'قبل 5 أيام', read:true, color:'teal'},
  ];

  const invoices = [
    {title:'القسط الدراسي - الفصل الثاني', amount:850, due:isoDate(new Date(today.getFullYear(),today.getMonth()+1,5)), status:'غير مدفوع'},
    {title:'رسوم الأنشطة اللاصفية', amount:120, due:isoDate(new Date(today.getFullYear(),today.getMonth(),20)), status:'متأخر'},
    {title:'القسط الدراسي - الفصل الأول', amount:850, due:isoDate(new Date(today.getFullYear(),today.getMonth()-2,5)), status:'مدفوع'},
  ];

  return {id,name,avatar,grade,class:'أ', attendance, grades, wallet:{balance,transactions:walletTxns},
          homework, schedule, messages, notifications, invoices, payments:[]};
}

/* ============ HELPERS ============ */
function attendanceStats(child){
  const s = {'حاضر':0,'غائب':0,'متأخر':0,'غياب بعذر':0};
  child.attendance.forEach(a=> s[a.status]++);
  const total = child.attendance.length;
  const pct = total ? Math.round((s['حاضر']/total)*100) : 100;
  return {...s, total, pct};
}
function gradeAverage(child){
  let sum=0, max=0;
  Object.values(child.grades).forEach(list=> list.forEach(g=>{sum+=g.score; max+=g.max;}));
  return max ? Math.round((sum/max)*100) : 0;
}
function subjectAvg(list){
  let sum=0,max=0; list.forEach(g=>{sum+=g.score;max+=g.max;});
  return max ? Math.round((sum/max)*100) : 0;
}
function ringColor(pct){ return pct>=85?'var(--success)': pct>=65?'var(--amber)':'var(--danger)'; }
function svgRing(pct,size,stroke,color,bg,animate){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-pct/100);
  const initOff = animate ? c : off;
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${bg||'#EDEFF3'}" stroke-width="${stroke}"/><circle class="${animate?'ring-anim':''}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${initOff}" data-target-offset="${off}" stroke-linecap="round"/></svg>`;
}
function playRingAnimations(container){
  (container||document).querySelectorAll('.ring-anim').forEach(circle=>{
    const target = circle.getAttribute('data-target-offset');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ circle.style.strokeDashoffset = target; }));
  });
}
function countUp(el, target, opts={}){
  const duration = opts.duration || 950;
  const decimals = opts.decimals || 0;
  const suffix = opts.suffix || '';
  const prefix = opts.prefix || '';
  const t0 = performance.now();
  function tick(now){
    const p = Math.min((now - t0) / duration, 1);
    const eased = p < 0.7 ? p * 1.15 : 1 - Math.pow(1 - p, 3) * 0.3; // steady climb, gentle settle
    const val = target * Math.min(eased, 1);
    el.textContent = prefix + val.toFixed(decimals) + suffix;
    if(p < 1) requestAnimationFrame(tick);
    else el.textContent = prefix + target.toFixed(decimals) + suffix;
  }
  requestAnimationFrame(tick);
}
function initCountUps(container){
  (container||document).querySelectorAll('.count-target').forEach(el=>{
    const target = parseFloat(el.dataset.count);
    if(isNaN(target)) return;
    const suffix = el.dataset.suffix || '';
    const prefix = el.dataset.prefix || '';
    const decimals = parseInt(el.dataset.decimals || '0');
    el.textContent = prefix + target.toFixed(decimals) + suffix;
  });
}
function showSkeleton(el, kind){
  if(kind==='hero'){
    el.innerHTML = `<div class="skeleton skel-hero"></div><div class="skel-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div><div class="skeleton skel-line"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div>`;
  } else {
    el.innerHTML = `<div class="skeleton skel-line"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div>`;
  }
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function daysLeft(dateStr){
  const diff = Math.ceil((new Date(dateStr) - new Date(new Date().toDateString())) / 86400000);
  if(diff===0) return 'اليوم';
  if(diff===1) return 'غداً';
  if(diff<0) return `متأخر ${Math.abs(diff)} يوم`;
  return `خلال ${diff} أيام`;
}

          return `<tr><td>${s.name}</td><td>${s.teacher}</td><td>${a}%</td></tr>`;
        }).join('')}
      </tbody>
      <tfoot><tr><td colspan="2">المعدل التراكمي العام</td><td>${avg}%</td></tr></tfoot>
    </table>`;
  } else {
    const st = attendanceStats(c);
    title = 'تقرير الحضور والغياب';
    bodyHTML = `<table class="rep-table">
      <thead><tr><th>الحالة</th><th>عدد الأيام</th></tr></thead>
      <tbody>
        <tr><td>حاضر</td><td>${st['حاضر']}</td></tr>
        <tr><td>غائب</td><td>${st['غائب']}</td></tr>
        <tr><td>متأخر</td><td>${st['متأخر']}</td></tr>
        <tr><td>غياب بعذر</td><td>${st['غياب بعذر']}</td></tr>
      </tbody>
      <tfoot><tr><td>نسبة الحضور الإجمالية</td><td>${st.pct}%</td></tr></tfoot>
    </table>`;
  }
  return `
    <div class="rep-header">
      <div class="rep-school">${DB.school}</div>
      <div class="rep-title">${title}</div>
    </div>
    <div class="rep-meta">

}

function openTopup(){
  document.getElementById('modalBody').innerHTML = `
    <h3>شحن محفظة المقصف</h3>
    <input type="number" id="topupAmt" placeholder="أدخل المبلغ (د.ل)" inputmode="numeric">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
      <button class="btn-confirm" onclick="confirmTopup()">تأكيد الشحن</button>
    </div>`;
  document.getElementById('overlay').classList.add('active');
}
function confirmTopup(){
  const v = parseFloat(document.getElementById('topupAmt').value);
  if(!v || v<=0){ toast('أدخل مبلغاً صحيحاً'); return; }
  const c = currentChild();
  c.wallet.balance += v;
  c.wallet.transactions.unshift({date:isoDate(new Date()), type:'شحن', amount:v, note:'شحن محفظة عبر التطبيق'});
  c.notifications.unshift({type:'فاتورة', icon:'💳', title:'تم شحن المحفظة', body:`تم شحن ${v} د.ل بنجاح إلى محفظة ${c.name}.`, time:'الآن', read:false, color:'success'});
  save(); closeModal(); renderAll(); toast(`تم شحن ${v} د.ل بنجاح`);
}
function closeModal(){ document.getElementById('overlay').classList.remove('active'); }

/* ============ RENDER: MORE (schedule / homework / messages / notifications / invoices) ============ */
function goTo(tab, seg){
  state.tab = tab;
  if(seg) state.moreSeg = seg;
  else if(tab==='more' && state.moreSeg==='schedule') state.moreSeg = 'grades';
  state.openChat = null;
  document.querySelectorAll('.nav-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.section').forEach(s=> s.classList.remove('active'));
  const target = document.getElementById('sec-'+tab);
  target.classList.add('active');
  document.getElementById('main').scrollTop = 0;
  showSkeleton(target, tab==='home' ? 'hero' : 'list');
  clearTimeout(window.__navTimer);
  window.__navTimer = setTimeout(()=>{ renderSection(tab); }, 190);
}

const SCHED_PALETTE = [
  {bg:'var(--teal-l)', c:'var(--teal)'},
  {bg:'#E7EAF2', c:'#16213E'},
  {bg:'var(--success-l)', c:'var(--success)'},
  {bg:'var(--amber-l)', c:'#8F1A1E'},
  {bg:'#F1E8F7', c:'#7A4FA0'},
  {bg:'var(--danger-l)', c:'var(--danger)'},
  {bg:'#E1F1FB', c:'#256E9C'},
  {bg:'#FDEEE3', c:'#B85C2E'},
];
function schedColor(name){
  let h=0; for(let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return SCHED_PALETTE[h % SCHED_PALETTE.length];
}
function renderSchedule(c){
  const days = Object.keys(c.schedule);
  const todayName = dayNameAr(new Date());
  if(!state.schedDay || !days.includes(state.schedDay)){
    state.schedDay = days.includes(todayName) ? todayName : days[0];
  }
  let html = `<div class="section-title">📅 الجدول الدراسي — ${c.name}</div><div class="sched-days">`;
  days.forEach(d=>{
    const count = c.schedule[d].filter(s=>s!=='فسحة').length;
    const isToday = d===todayName;
    html += `<div class="sched-day-btn ${d===state.schedDay?'active':''} ${isToday?'is-today':''}" onclick="setSchedDay('${d}')">
      <div class="sd-name">${d}${isToday?' •':''}</div>
      <div class="sd-count">${count} حصص</div>
    </div>`;
  });
  html += `</div><div class="card" id="schedList">${renderSchedList(c)}</div>`;
  return html;
}
function renderSchedList(c){
  const periods = c.schedule[state.schedDay];
  return periods.map((subj,idx)=>{
    const time = periodTimeLabel(idx);
    if(subj==='فسحة'){
      return `<div class="period-row is-break" style="--pr-accent:var(--amber);">
        <div class="period-num">${idx+1}</div>
        <div class="period-subj"><div class="ps-name">☕ فسحة</div><div class="ps-tag">${time}</div></div>
      </div>`;
    }
    const col = schedColor(subj);
    return `<div class="period-row" style="--pr-accent:${col.c};">
      <div class="period-num" style="background:${col.bg}; color:${col.c};">${idx+1}</div>
      <div class="period-subj"><div class="ps-name">${subj}</div><div class="ps-tag">${time}</div></div>
      <span class="period-chip" style="background:${col.c};"></span>
    </div>`;
  }).join('');
}
function setSchedDay(d){
  state.schedDay = d;
  const c = currentChild();
  document.querySelectorAll('.sched-day-btn').forEach(b=>{
    const isActive = b.querySelector('.sd-name').textContent.startsWith(d);
    b.classList.toggle('active', isActive);
  });
  document.getElementById('schedList').innerHTML = renderSchedList(c);
}

function renderHomework(c){

  if(!c.homework.length) html += `<div class="empty">لا توجد واجبات مسجّلة</div>`;

    const realIdx = c.homework.indexOf(h);

      <div class="mini-body">
        <div class="hw-title ${h.status?'done':''}">${h.title}</div>
        <div class="hw-meta">${h.subject} • ${daysLeft(h.dueDate)}</div>

    </div>`;
  });

}
function toggleHw(i){

  c.homework[i].status = !c.homework[i].status;

}

function renderMessages(c){
  if(state.openChat!==null){
    const m = c.messages[state.openChat];
    let html = `<div class="chat-view active">
      <div class="chat-head">
        <button class="chat-back" onclick="closeChat()">←</button>
        <div class="t-avatar">${m.teacher[0]}</div>
        <div><div class="t-name">${m.teacher}</div><div class="t-sub">${m.subject}</div></div>
      </div>
      <div class="chat-msgs" id="chatMsgs">
        ${m.thread.map(t=>`<div class="msg-bubble ${t.from==='parent'?'them':'me'}">${t.text}<span class="msg-time">${t.time}</span></div>`).join('')}
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
        <button class="chat-send" onclick="sendMsg()">↑</button>
      </div>
    </div>`;
    return html;
  }
  let html = `<div class="card">`;
  c.messages.forEach((m,i)=>{
    const last = m.thread[m.thread.length-1];
    html += `<div class="teacher-row" onclick="openChat(${i})">
      <div class="t-avatar">${m.teacher[0]}</div>
      <div class="mini-body"><div class="t-name">${m.teacher}</div><div class="t-sub">${m.subject} — ${last.text.slice(0,28)}${last.text.length>28?'…':''}</div></div>
    </div>`;
  });

function openChat(i){ state.openChat=i; renderMoreContent(); setTimeout(()=>{const el=document.getElementById('chatMsgs'); if(el) el.scrollTop=el.scrollHeight;},50); }
function closeChat(){ state.openChat=null; renderMoreContent(); }
function sendMsg(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  const c = currentChild();
  c.messages[state.openChat].thread.push({from:'parent', text, time: new Date().toLocaleTimeString('ar-LY',{hour:'2-digit',minute:'2-digit'})});
  save(); renderMoreContent();
  setTimeout(()=>{const el=document.getElementById('chatMsgs'); if(el) el.scrollTop=el.scrollHeight;},50);
}

function renderNotifications(c){
  let html = `<div class="card">`;
  if(!c.notifications.length) html += `<div class="empty">لا توجد إشعارات</div>`;
  c.notifications.forEach((n,i)=>{
    html += `<div class="notif-row ${!n.read?'unread':''}" onclick="markRead(${i})">

  return html;

function markRead(i){ const c=currentChild(); c.notifications[i].read=true; save(); renderMoreContent(); updateBell(); }

function renderInvoices(c){
  const custom = c.payments.reduce((s,p)=>s+p.amount,0);
  const invPaid = c.invoices.filter(i=>i.status==='مدفوع').reduce((s,i)=>s+i.amount,0);
  const invUnpaid = c.invoices.filter(i=>i.status!=='مدفوع').reduce((s,i)=>s+i.amount,0);
  const totalPaid = invPaid + custom;
  const totalDue = Math.max(0, invUnpaid - custom);

  let html = `<div class="wallet-hero">
    <div class="wl-lbl">الملخص المالي — ${c.name}</div>
    <div class="fin-split">
      <div class="fin-col"><div class="fin-val" style="color:#8FE3B0;">${totalPaid.toFixed(0)} د.ل</div><div class="fin-lbl">إجمالي المدفوع</div></div>
      <div class="fin-divider"></div>
      <div class="fin-col"><div class="fin-val" style="color:#F7C873;">${totalDue.toFixed(0)} د.ل</div><div class="fin-lbl">المبلغ المتبقي</div></div>
    </div>
  </div>

  <div class="section-title">قائمة الدفعات</div>
  <div class="card">`;
  c.invoices.forEach((inv,i)=>{
    html += `<div class="inv-row">
      <div class="mini-ic" style="background:var(--amber-l);">🧾</div>
      <div class="mini-body"><div class="inv-title">${inv.title}</div><div class="inv-sub">${inv.amount} د.ل — استحقاق ${fmtDate(new Date(inv.due))}</div></div>
      ${inv.status==='مدفوع' ? `<span class="badge success">مدفوع</span>` : `<button class="pay-btn" onclick="payInvoice(${i})">دفع الآن</button>`}
    </div>`;
  });
  if(c.payments.length){
    c.payments.slice().reverse().forEach(p=>{
      html += `<div class="inv-row">
        <div class="mini-ic" style="background:var(--success-l); color:var(--success);">💳</div>
        <div class="mini-body"><div class="inv-title">دفعة مبلغ</div><div class="inv-sub">${fmtDate(new Date(p.date))}</div></div>
        <span class="badge success">${p.amount} د.ل</span>
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="section-title">دفع مبلغ آخر</div>
  <div class="card">
    <div class="field-wrap" style="margin-bottom:10px;">
      <input type="number" id="customPayAmt" placeholder="أدخل المبلغ (د.ل)" inputmode="numeric">
      <span class="field-icon">د.ل</span>
    </div>
    <button class="wl-btn primary" style="width:100%; padding:11px;" onclick="payCustomAmount()">دفع الآن</button>
  </div>`;

  return html;
}
function payInvoice(i){
  const c = currentChild();
  c.invoices[i].status = 'مدفوع';
  c.notifications.unshift({type:'فاتورة', icon:'✅', title:'تم سداد الفاتورة', body:`تم سداد "${c.invoices[i].title}" بنجاح.`, time:'الآن', read:false, color:'success'});
  save(); renderMoreContent(); renderHome(); toast('تم السداد بنجاح ✅');
}
function payCustomAmount(){
  const v = parseFloat(document.getElementById('customPayAmt').value);
  if(!v || v<=0){ toast('أدخل مبلغاً صحيحاً'); return; }
  const c = currentChild();
  c.payments.push({date:isoDate(new Date()), amount:v});
  c.notifications.unshift({type:'فاتورة', icon:'💳', title:'تم استلام دفعة', body:`تم سداد مبلغ ${v} د.ل من الرصيد المستحق على ${c.name}.`, time:'الآن', read:false, color:'success'});
  save(); renderMoreContent(); renderHome(); toast(`تم سداد ${v} د.ل بنجاح ✅`);
}

/* ============ BOOT FLOW: splash -> login -> app ============ */
function showApp(){
  document.getElementById('loginScreen').classList.remove('show');
  const app = document.getElementById('app');
  app.classList.add('show');
  renderAll();
}
function handleLogin(e){
  e.preventDefault();
  const phone = document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  if(phone.length < 8 || pass.length < 4){
    err.classList.add('show');
    return false;
  }
  err.classList.remove('show');
  localStorage.setItem('waliAmr_loggedIn','1');
  localStorage.setItem('waliAmr_phone', phone);
  showApp();
  return false;
}
window.addEventListener('DOMContentLoaded', ()=>{
  // منع تكبير/تصغير الشاشة باللمس (pinch) والنقر المزدوج
  document.addEventListener('gesturestart', e=> e.preventDefault());
  document.addEventListener('gesturechange', e=> e.preventDefault());
  document.addEventListener('gestureend', e=> e.preventDefault());
  document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e=>{
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, {passive:false, capture:true});

  const splash = document.getElementById('splashScreen');
  const login = document.getElementById('loginScreen');
  const mainEl = document.getElementById('main');
  const headerEl = document.querySelector('header.top');
  mainEl.addEventListener('scroll', ()=>{
    headerEl.classList.toggle('scrolled', mainEl.scrollTop > 16);
  }, {passive:true});
  if(localStorage.getItem('waliAmr_loggedIn')){
    renderAll();
    document.getElementById('app').classList.add('show');
  } else {
    login.classList.add('show');
  }
  setTimeout(()=>{
    splash.classList.add('fade-out');
    setTimeout(()=>{ splash.style.display = 'none'; }, 400);
  }, 1200);

  // تعويض حركة الفيوبورت المرئي في سفاري (iOS) عند ظهور الكيبورد
  // العناصر position:fixed مثبتة على فيوبورت التخطيط، وسفاري يسحب الفيوبورت المرئي فوقه عند التركيز على حقل،
  // فتبدو العناصر الثابتة وكأنها تتحرك. هذا الحل يعوّض الإزاحة بترجمة (transform) معاكسة.
  const fixedScreens = [splash, login, document.getElementById('app')].filter(Boolean);
  const compensateViewport = ()=>{
    const vv = window.visualViewport;
    if(!vv) return;
    const x = vv.offsetLeft || 0;
    const y = vv.offsetTop || 0;
    fixedScreens.forEach(el=>{
      el.style.transform = (x || y) ? `translate(${x}px, ${y}px)` : '';
    });
  };
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', compensateViewport);
    window.visualViewport.addEventListener('scroll', compensateViewport);
  }
});
